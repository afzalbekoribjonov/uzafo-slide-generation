services:
  - type: web
    name: slide-generator-bot
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: APP_MODE
        value: webhook
      - key: WEBHOOK_PATH
        value: /telegram/webhook
      - key: WEBHOOK_DROP_PENDING_UPDATES
        value: "false"
